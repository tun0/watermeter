name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - collect_snapshots.py
      - Dockerfile
      - Dockerfile.reader
      - meter_reader.py
      - pyproject.toml
      - requirements*.txt
      - tests/**
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: collector
            dockerfile: Dockerfile
            image: ghcr.io/tun0/watermeter/collector
          - name: reader
            dockerfile: Dockerfile.reader
            image: ghcr.io/tun0/watermeter/reader

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDDHHmmss'}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Notify Flux
        env:
          WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
        run: |
          PAYLOAD='{"action":"published"}'
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_TOKEN" | awk '{print $NF}')
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: registry_package" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
