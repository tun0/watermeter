apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meter-data-pvc
  namespace: watermeter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meter-reader
  namespace: watermeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meter-reader
  template:
    metadata:
      labels:
        app: meter-reader
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: meter-reader
          image: ghcr.io/tun0/watermeter/reader:latest
          env:
            - name: CAM_SNAPSHOT_URL
              valueFrom:
                configMapKeyRef:
                  name: watermeter-config
                  key: CAM_SNAPSHOT_URL
            # - name: FLOW_MAX_AGE
            #   valueFrom:
            #     configMapKeyRef:
            #       name: watermeter-config
            #       key: FLOW_MAX_AGE
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: watermeter-secrets
                  key: HA_TOKEN
            - name: HA_URL
              valueFrom:
                secretKeyRef:
                  name: watermeter-secrets
                  key: HA_URL
            # - name: INITIAL_VALUE
            #   valueFrom:
            #     configMapKeyRef:
            #       name: watermeter-config
            #       key: INITIAL_VALUE
            - name: MAX_STEP
              valueFrom:
                configMapKeyRef:
                  name: watermeter-config
                  key: MAX_STEP
            - name: READING_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: watermeter-config
                  key: READING_INTERVAL
            - name: STATE_FILE
              value: /app/data/.meter_state.json
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: meter-data-pvc
