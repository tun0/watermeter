apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapshots-pvc
  namespace: watermeter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: watermeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      securityContext:
        runAsUser: 1000
      containers:
        - name: collector
          image: ghcr.io/tun0/watermeter/collector:latest
          envFrom:
            - configMapRef:
                name: watermeter-config
          volumeMounts:
            - name: snapshots
              mountPath: /app/snapshots
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: snapshots
          persistentVolumeClaim:
            claimName: snapshots-pvc
