apiVersion: v1
kind: Namespace
metadata:
  name: watermeter

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapshots
  namespace: watermeter
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  # storageClassName: longhorn   # uncomment to pin to a specific class

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: watermeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: ghcr.io/tun0/watermeter:latest
          env:
            - name: CAM_SNAPSHOT_URL
              value: "http://192.168.x.x/"
            - name: CAM_STREAM_URL
              value: "http://192.168.x.x:8080/"
            - name: COLLECTOR_INTERVAL
              value: "10"
          volumeMounts:
            - name: snapshots
              mountPath: /app/snapshots
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: snapshots
          persistentVolumeClaim:
            claimName: snapshots
